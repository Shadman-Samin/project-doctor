[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-doctor"
version = "0.1.0"
description = "A CLI tool that scans a project directory and reports common repository hygiene issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
project-doctor = "project_doctor.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["project_doctor*"]
